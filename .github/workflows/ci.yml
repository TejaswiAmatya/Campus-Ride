name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-unit-tests:
    name: Backend — unit stage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campus_ride_ci

      - name: Type-check
        working-directory: backend
        run: npx tsc --noEmit
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campus_ride_ci

      - name: Run unit quality gate
        working-directory: backend
        run: npm run test:unit:gate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campus_ride_ci
          SUPABASE_JWT_SECRET: ci-test-jwt-secret-32-chars-long!!

  backend-integration-tests:
    name: Backend — integration stage
    runs-on: ubuntu-latest
    needs: backend-unit-tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campus_ride_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d campus_ride_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campus_ride_ci

      - name: Apply Prisma migrations
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campus_ride_ci

      - name: Run integration quality gate
        working-directory: backend
        run: npm run test:integration:gate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campus_ride_ci
          RUN_LIVE_INTEGRATION_TESTS: true
          RUN_AUTH_INTEGRATION_TESTS: false
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          SUPABASE_JWT_SECRET: ci-test-jwt-secret-32-chars-long!!

  frontend-typecheck:
    name: Frontend — type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npm run type-check
